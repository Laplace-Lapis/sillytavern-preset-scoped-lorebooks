<div id="presetScopedLorebooksBlock" class="inline-drawer preset-scoped-lorebooks">
    <div class="inline-drawer-toggle inline-drawer-header">
        <b data-i18n="Preset Lorebooks">Preset Lorebooks</b>
        <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
        <small data-i18n="Global lorebooks owned by a preset are only used while one of their owning presets is selected. Lorebooks not owned by any preset work as usual.">
            Global lorebooks owned by a preset are only used while one of their owning presets is selected. Lorebooks not owned by any preset work as usual.
        </small>
        <div class="preset-scoped-lorebooks-subtitle" data-i18n="Owned by the current preset">Owned by the current preset</div>
        <div class="preset-scoped-lorebooks-add-row flex-container flexGap5">
            <select id="presetScopedLorebooksAddSelect" class="text_pole flex1"></select>
            <div id="presetScopedLorebooksAddBtn" class="menu_button fa-solid fa-plus" data-i18n="[title]Add lorebook" title="Add lorebook"></div>
        </div>
        <div id="presetScopedLorebooksOwnedEmpty" class="preset-scoped-lorebooks-empty" data-i18n="This preset owns no lorebooks.">This preset owns no lorebooks.</div>
        <div id="presetScopedLorebooksOwned" class="preset-scoped-lorebooks-list"></div>
        <div class="preset-scoped-lorebooks-subtitle" data-i18n="All scoped lorebooks">All scoped lorebooks</div>
        <div id="presetScopedLorebooksAllEmpty" class="preset-scoped-lorebooks-empty" data-i18n="No lorebooks are scoped yet.">No lorebooks are scoped yet.</div>
        <div id="presetScopedLorebooksAll" class="preset-scoped-lorebooks-list"></div>
    </div>
</div>
